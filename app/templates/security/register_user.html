{% extends "base.html" %}
{% block content %}
<h2>Register</h2>
<form id="register-form">
  <input type="text" name="username" placeholder="Username" required><br>
  <input type="password" name="password" placeholder="Password" required><br>
  <div class="g-recaptcha" data-sitekey="{{ config['RECAPTCHA_PUBLIC_KEY'] }}"></div><br>
  <button type="submit">Register</button>
</form>
<div id="register-response" class="mt-3"></div>
<script>
document.getElementById("register-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const username = e.target.username.value;
  const password = e.target.password.value;
  const recaptcha = grecaptcha.getResponse();

  const res = await fetch("/register", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username, password, recaptcha })
  });
  const json = await res.json();
  document.getElementById("register-response").innerText = JSON.stringify(json);
});
</script>
{% endblock %}
